name: Update Higher or Lower dataset

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: higher-lower-data-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/higher-lower/requirements.txt
      - name: Install pinned data adapter
        run: pip install -r scripts/higher-lower/requirements.txt
      - name: Verify importer rules
        run: python -m unittest discover -s scripts/higher-lower -p 'test_*.py'
      - name: Fetch, validate, and publish complete snapshot
        run: python scripts/higher-lower/sync.py --publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Preserve validated snapshot as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: higher-lower-snapshot
          path: tmp/higher-lower/validated-snapshot.json
